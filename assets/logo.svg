<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Detail On Demand">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8E9FB"/>
    </linearGradient>
    <linearGradient id="face2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F8FE"/>
      <stop offset="1" stop-color="#C6DDF6"/>
    </linearGradient>
  </defs>
  <g transform="translate(4,0) skewX(-7)">
    <!-- D band: top bar, right bowl, bottom slab; open on the left -->
    <path fill="url(#face)" d="M42,36 L140,36 C181,36 197,61 197,99 C197,137 181,162 140,162 L27,162 L33,139 L138,139 C163,139 173,125 173,99 C173,73 163,59 138,59 L36,59 Z"/>
    <path fill="#FFFFFF" opacity=".9" d="M42,36 L140,36 C156,36 168,40 176,48 L168,56 C160,60 150,59 138,59 L36,59 Z"/>
    <!-- floor shadow inside the window -->
    <ellipse cx="102" cy="136" rx="62" ry="4" fill="#04142B" opacity=".3"/>

    <!-- detailer -->
    <g fill="url(#face2)">
      <circle cx="56" cy="81" r="6.4"/>
      <path d="M49.4,79.5 a6.9,6.9 0 0 1 13,-2.6 l-1.6,2 q-5.2,-3.2 -9.8,1.6 z"/><rect x="59.5" y="76.2" width="7.2" height="2.7" rx="1.3"/><!-- cap crown + brim toward the car -->
      <path d="M51,89 q5.5,-2.6 10.5,.2 l2,1 12.5,1 -0.4,5 -12.5,-0.6 -1.6,20 6.5,19 -6,2 -7.5,-18.5 -4.5,19 -6.2,-1 5,-24.5 z"/><!-- torso, arm base, legs -->
      <rect x="74" y="88.8" width="9.5" height="5.8" rx="2.2"/><!-- sprayer -->
      <rect x="83" y="90.2" width="5" height="3" rx="1.4"/><!-- nozzle -->
      <rect x="76" y="94.5" width="5.4" height="8" rx="2.4"/><!-- bottle -->
    </g>

    <!-- spray arc -->
    <g fill="#FFFFFF">
      <circle cx="91" cy="91" r="1.4"/><circle cx="96.5" cy="89.8" r="1.6"/><circle cx="102" cy="89.6" r="1.8"/>
      <circle cx="107.5" cy="90.6" r="2"/><circle cx="112.5" cy="92.6" r="2.2"/><circle cx="117" cy="95.6" r="2.4"/>
    </g>

    <!-- car -->
    <path fill="url(#face2)" d="M94,132 l3,-9 q2,-5 8,-5 l6,-7 q3,-3 8,-3 l14,0 q5,0 8,3.5 l5,6.5 q10,1 12,6 l1.5,8 z"/>
    <circle cx="112" cy="132" r="6.6" fill="#0A2D6B"/><circle cx="112" cy="132" r="2.7" fill="#F2F8FE"/>
    <circle cx="147" cy="132" r="6.6" fill="#0A2D6B"/><circle cx="147" cy="132" r="2.7" fill="#F2F8FE"/>

    <!-- foam -->
    <g fill="#FFFFFF">
      <circle cx="112" cy="105" r="7"/><circle cx="121" cy="100" r="8.5"/><circle cx="131" cy="97" r="7.5"/>
      <circle cx="140" cy="100" r="8"/><circle cx="148" cy="105" r="6.5"/><circle cx="118" cy="109" r="6"/>
      <circle cx="128" cy="106" r="6.5"/><circle cx="137" cy="107" r="6"/><circle cx="145" cy="111" r="5"/>
      <circle cx="106" cy="110" r="5"/>
    </g>
    <g fill="#C6DDF6">
      <circle cx="124" cy="102" r="1.8"/><circle cx="135" cy="100" r="1.5"/><circle cx="115" cy="107" r="1.4"/>
    </g>

    <!-- floating bubbles -->
    <g fill="none" stroke="#FFFFFF" stroke-width="1.6">
      <circle cx="118" cy="82" r="3.4"/><circle cx="130" cy="75" r="2.4"/><circle cx="141" cy="82" r="2.9"/><circle cx="150" cy="73" r="1.9"/>
    </g>
  </g>
</svg>
